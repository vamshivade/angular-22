<div class="text-center text-2xl min-h-screen mb-[300px]">
  <div class="text-center text-3xl mb-4">
    <h3>1. One-way Data Binding</h3>
  </div>
  <h3>1. Interpolation Binding</h3>
  <p>{{ name }}</p>
  <br />
  <br />
  <h3>2. Property Binding</h3>
  <br />
  <input type="text" [value]="topic" class="border border-black p-1 px-3 rounded-md" />
  <br />
  <br />
  <div class="w-70 h-50 border border-yellow mx-auto p-3">
    <img [src]="image" alt="butterfly" class="w-full h-full" />
  </div>
  <br />
  <br />
  <h3>3. Event Binding</h3>
  <div>
    <button
      class="text-white text-2xl bg-blue-500 rounded p-2 px-4 cursor-pointer mt-5"
      (click)="onSubmitClick()"
    >
      Submit
    </button>
  </div>

  <div class="p-2 my-5">
    <select (change)="onCountryChange1($event)" name="" id="" class="border p-2 px-4 rounded">
      <option value="">Select Country</option>
      <option value="India">India</option>
      <option value="USA">USA</option>
      <option value="Australia">Australia</option>
      <option value="Germany">Germany</option>
    </select>
  </div>

  <div class="p-2 my-5">
    <select #country (change)="onCountryChange2(country.value)">
      <option value="">Select Country</option>
      <option value="India">India</option>
      <option value="USA">USA</option>
    </select>
  </div>

  <br />
  <br />

  <div class="text-center text-3xl mb-4">
    <h3>4. Two-way Data Binding - ngModel</h3>
  </div>
  <div>
    <!-- <input name="" id="" class="border w-1/2" [value]="name" (input)="name = $event.target.value" /> -->
    <input name="" id="" class="border w-1/2" [(ngModel)]="name" />
    <p>
      {{ name }}
    </p>
  </div>
</div>
