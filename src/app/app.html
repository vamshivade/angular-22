<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="flex justify-between px-10 items-center min-h-[10vh] shrink-0">
    <h1 class="text-3xl text-blue-700 font-medium">Angular 22</h1>

    <nav>
      <ul class="flex items-center gap-10">
        <li class="text-xl">
          <a
            routerLink="/pages/home"
            routerLinkActive="text-2xl text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Home
          </a>
        </li>

        <li class="text-xl">
          <a
            routerLink="/pages/about"
            routerLinkActive="text-2xl text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            About
          </a>
        </li>

        <li class="text-xl">
          <a
            routerLink="/pages/contact"
            routerLinkActive="text-2xl text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Contact
          </a>
        </li>

        <li class="text-xl">
          <a routerLink="/pages/products" routerLinkActive="text-2xl text-blue-700"> Products </a>
        </li>

        <li class="text-xl">
          <a [routerLink]="['/pages/dashboard']" routerLinkActive="text-2xl text-blue-700">
            Dashboard
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Page Content -->
  <main class="flex-1 min-w-0">
    <router-outlet></router-outlet>
  </main>
</div>
