<div class="min-h-[90vh] flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold text-center text-blue-700">Create Account</h1>

    <p class="text-center text-gray-500 mt-2">Register your account</p>

    <form class="mt-8 space-y-5">
      <!-- Email -->
      <div>
        <label class="block mb-2 font-medium text-gray-700"> Email </label>

        <input
          type="email"
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block mb-2 font-medium text-gray-700"> Password </label>

        <input
          type="password"
          placeholder="Enter your password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Register Button -->
      <button
        type="submit"
        (click)="onRegister()"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 cursor-pointer"
      >
        Register
      </button>
    </form>

    <p class="text-center text-gray-500 mt-6">
      Already have an account?
      <a (click)="onLogin()" class="text-blue-600 hover:underline cursor-pointer"> Login </a>
    </p>
  </div>
</div>
