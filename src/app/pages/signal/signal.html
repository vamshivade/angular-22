<div class="min-h-[90vh] flex items-center justify-center bg-green-50">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow">
    <h1 class="text-3xl font-bold text-center text-green-700">📶Signal Component</h1>

    <div class="mt-5 space-y-4">
      <p class="text-blue-700 text-3xl text-center font-bold">Count : {{ count() }}</p>
      <div class="mt-3 flex gap-2 justify-center">
        <button class="bg-red-500 p-2 px-3 text-white flex-1 cursor-pointer" (click)="decrement()">
          Decrement
        </button>
        <button class="bg-yellow-400 p-2 px-3 text-white flex-1 cursor-pointer" (click)="reset()">
          Reset
        </button>
        <button
          class="bg-green-500 p-2 px-3 text-white flex-1 cursor-pointer"
          (click)="increment()"
        >
          Increment
        </button>
      </div>
    </div>
    <hr class="mt-5" />

    <div class="mt-5 space-y-4">
      <p class="text-blue-700 text-3xl text-center font-bold">
        Cart total of {{ cart.quantity() }}:
        {{ cart.total() }}
      </p>

      <div class="mt-3 flex gap-2 justify-center">
        <button
          class="bg-red-500 p-2 px-3 text-white flex-1 cursor-pointer"
          (click)="cart.decreaseQuantity()"
        >
          -
        </button>

        <button
          class="bg-yellow-400 p-2 px-3 text-white flex-1 cursor-pointer"
          (click)="cart.resetQuantity()"
        >
          Reset
        </button>

        <button
          class="bg-green-500 p-2 px-3 text-white flex-1 cursor-pointer"
          (click)="cart.increaseQuantity()"
        >
          +
        </button>
      </div>

      <div class="text-center">
        <p>Price: {{ cart.price() }}</p>

        <button
          class="bg-blue-500 p-2 px-3 text-white rounded cursor-pointer"
          (click)="cart.changePrice()"
        >
          Increase Price
        </button>
      </div>
    </div>

    <div class="mt-5 space-y-4">
      <p class="text-blue-700 text-3xl text-center font-bold">theme : {{ theme() }}</p>
      <div class="mt-3 flex gap-2 justify-center">
        <button
          class="p-2 px-3 text-white flex-1 cursor-pointer"
          (click)="setTheme()"
          [ngStyle]="{ background: theme() }"
        >
          Change Theme
        </button>
      </div>
    </div>
  </div>
</div>
