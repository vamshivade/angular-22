<div class="h-[90vh] flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold text-center text-blue-700">Login</h1>

    <p class="text-center text-gray-500 mt-2">Welcome back!</p>

    <div class="mt-8 space-y-5">
      <div>
        <label class="block mb-2 font-medium text-gray-700"> Email </label>

        <input
          type="email"
          placeholder="Enter your email"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block mb-2 font-medium text-gray-700"> Password </label>

        <input
          type="password"
          placeholder="Enter your password"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        (click)="onLogin()"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 cursor-pointer"
      >
        Login
      </button>
    </div>

    <p class="text-center text-gray-500 mt-6 ">
      Don't have an account?
      <!-- <a [routerLink]="'/pages/register'" class="text-blue-600 hover:underline"> Sign Up </a> -->
      <a (click)="onRegister()" class="text-blue-600 hover:underline cursor-pointer"> Sign Up </a>
    </p>
  </div>
</div>
