<div class="h-[90vh] flex items-center justify-center bg-green-50">
      <div class="w-full max-w-md bg-white p-8 rounded-xl shadow">
        <h1 class="text-3xl font-bold text-center text-green-700">
          Contact Us
        </h1>

        <div class="mt-6 space-y-4">
          <input
            type="text"
            placeholder="Your Name"
            class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-green-500"
          />

          <input
            type="email"
            placeholder="Your Email"
            class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-green-500"
          />

          <textarea
            placeholder="Your Message"
            rows="4"
            class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-green-500"
          ></textarea>

          <button
            class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700"
          >
            Send Message
          </button>
        </div>
      </div>
    </div>
