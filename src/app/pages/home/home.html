<div class="min-h-[90vh] flex items-center justify-center bg-blue-50">
  <div class="text-center">
    <h1 class="text-4xl font-bold text-blue-700">{{ title }}</h1>

    <p class="mt-4 text-lg text-gray-600">{{ getMessage() }}</p>

    <div class="flex justify-center gap-3">
      <button
        class="mt-6 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700"
        (click)="showMessage1($event)"
      >
        Click Me
      </button>

      <button
        class="mt-6 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700"
        (click)="showMessage2('VAMSHI')"
      >
        Get Name
      </button>
    </div>

    <!-- <input type="text" class="border p-2 px-3 mt-5 w-full" (input)="showInput($event)" />

    <input type="text" class="border p-2 px-3 mt-5 w-full" (keyup)="showKeyPressed($event)"/>

    <input type="text" class="border p-2 px-3 mt-5 w-full" (keyup.enter)="search($event)"/> -->

    <!-- <input type="text" class="border p-2 px-3 mt-5 w-full" [(ngModel)]="name" />
    <p>{{ name }}</p> -->

    <input type="text" class="border p-2 px-3 mt-5 w-full" #name />
    <p>{{ name.value }}</p>

    <button
      class="mt-6 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700"
      (click)="showName(name.value)"
    >
      Show Name
    </button>

    <p class="mt-6 px-6 py-3 text-blue-600">{{ count() }}</p>
  </div>
</div>
